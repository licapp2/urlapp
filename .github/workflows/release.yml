name: Build and publish APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # GitHub's Ubuntu runner already has Android SDK installed.
      # Avoid setup-android here because its sdkmanager setup failed in the previous run.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platform-tools"
          test -d "${ANDROID_HOME}/platforms"

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiosk-Browser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "Kiosk-Browser-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "Kiosk-Browser-${GITHUB_REF_NAME}.apk" \
            --title "Kiosk Browser ${GITHUB_REF_NAME}" \
            --generate-notes
